<div class="max-w-2xl p-6 mx-auto bg-white rounded-lg shadow">
    <h1 class="mb-6 text-3xl font-bold text-gray-900">Lista Alumnos</h1>
    <form class="max-w-sm mx-auto" [formGroup]="formulario">
 
        <div class="mb-5">



            <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">Matricula</label>
            <input 
                formControlName="matricula"
                type="text" 
                id="name" 
                name="name" 
                required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                   focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" 
                placeholder="escribe aquí">




            <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
            <input 
                formControlName="nombre"
                type="text" 
                id="name" 
                name="name" 
                required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                   focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" 
                placeholder="escribe aquí">


            <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">Correo</label>
            <input 
                formControlName="correo"
                type="text" 
                id="name" 
                name="name" 
                required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                   focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" 
                placeholder="escribe aquí">



            <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">Materia</label>
            <input 
                formControlName="materia"
                type="text" 
                id="name" 
                name="name" 
                required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                   focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" 
                placeholder="escribe aquí">



            <div class="flex justify-end mt-5">

                <button
                (click)="muestraAlumnos()"
                 type="submit" class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed">
                    Registrar
                </button>
            </div>
        </div>
    </form>
    <div>
        <h3>Matricula: {{alumnos.matricula}}</h3>
        <h3>Nombre: {{alumnos.nombre}}</h3>
        <h3>Correo: {{alumnos.correo}}</h3>
        <h3>Materia: {{alumnos.materia}}</h3>
    </div>
</div>
